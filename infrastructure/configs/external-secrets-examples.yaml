---
# Example 1: DNS Provider API Token for cert-manager
# This example shows how to sync a single secret from Azure Key Vault
# to be used by cert-manager for DNS-01 challenges (e.g., Cloudflare API token)
#
# NOTE: These are EXAMPLES ONLY - they will not work without proper Key Vault setup
# Comment them out or delete if not using External Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  annotations:
    # Mark as example - won't create actual secret without valid Key Vault
    external-secrets.io/ignore: "true"
spec:
  # Refresh interval - how often to check for updates
  refreshInterval: 1h
  
  # Reference to the ClusterSecretStore
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  
  # Target Kubernetes secret to create/update
  target:
    name: cloudflare-api-token-secret
    creationPolicy: Owner  # ESO owns and manages this secret
    
    # Optional: Define the secret type
    template:
      type: Opaque
      data:
        # Template the data - key name in K8s secret : value from Key Vault
        api-token: "{{ .cloudflareApiToken }}"
  
  # Data to fetch from Azure Key Vault
  data:
    - secretKey: cloudflareApiToken  # Key as it will be referenced in template
      remoteRef:
        key: cloudflare-api-token  # Name of the secret in Azure Key Vault

---
# Example 2: ACME Account Credentials
# Fetch ACME account credentials for Let's Encrypt
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: acme-account-key
  namespace: cert-manager
  annotations:
    external-secrets.io/ignore: "true"
spec:
  refreshInterval: 24h
  
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  
  target:
    name: letsencrypt-account-key
    creationPolicy: Owner
  
  data:
    - secretKey: tls.key
      remoteRef:
        key: letsencrypt-private-key

---
# Example 3: Multiple secrets in one ExternalSecret
# Sync multiple related secrets from Azure Key Vault
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dns-provider-credentials
  namespace: cert-manager
  annotations:
    external-secrets.io/ignore: "true"
spec:
  refreshInterval: 1h
  
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  
  target:
    name: dns-provider-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Multiple keys in the same secret
        api-token: "{{ .apiToken }}"
        api-key: "{{ .apiKey }}"
        email: "{{ .email }}"
  
  data:
    - secretKey: apiToken
      remoteRef:
        key: dns-provider-api-token
    - secretKey: apiKey
      remoteRef:
        key: dns-provider-api-key
    - secretKey: email
      remoteRef:
        key: dns-provider-email

---
# Example 4: Azure DNS credentials (if using Azure DNS for cert-manager)
# This shows a more complex example with JSON credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: azuredns-credentials
  namespace: cert-manager
  annotations:
    external-secrets.io/ignore: "true"
spec:
  refreshInterval: 6h
  
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  
  target:
    name: azuredns-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Create a JSON credentials file
        client-secret: "{{ .clientSecret }}"
  
  data:
    - secretKey: clientSecret
      remoteRef:
        key: azure-dns-sp-password

---
# Example 5: Using dataFrom to sync all secrets with a prefix
# This will sync all secrets from Key Vault that match the filter
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cert-manager-all-secrets
  namespace: cert-manager
  annotations:
    # This is an example - uncomment to use
    external-secrets.io/ignore: "true"
spec:
  refreshInterval: 1h
  
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  
  target:
    name: cert-manager-synced-secrets
    creationPolicy: Owner
  
  # Sync all secrets with a specific tag or prefix
  dataFrom:
    - find:
        # Regex pattern to match secret names
        name:
          regexp: "^cert-manager-.*"

---
# Example 6: ExternalSecret for default namespace
# Shows how to create secrets for applications in other namespaces
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-database-credentials
  namespace: default
  annotations:
    external-secrets.io/ignore: "true"
spec:
  refreshInterval: 5m
  
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  
  target:
    name: database-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "{{ .dbUsername }}"
        password: "{{ .dbPassword }}"
        connection-string: "postgresql://{{ .dbUsername }}:{{ .dbPassword }}@postgres:5432/mydb"
  
  data:
    - secretKey: dbUsername
      remoteRef:
        key: database-username
    - secretKey: dbPassword
      remoteRef:
        key: database-password
