---
# ClusterSecretStore for Azure Key Vault (cluster-wide)
# This allows any namespace to access secrets from Azure Key Vault
# Note: Using ClusterSecretStore allows cross-namespace ServiceAccount references
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azurekv:
      # CONFIGURE: Replace with your Azure Key Vault URL
      # Example: https://my-keyvault.vault.azure.net
      vaultUrl: "https://YOUR_KEYVAULT_NAME.vault.azure.net"
      
      # Authentication using Azure Workload Identity
      authType: WorkloadIdentity
      
      # Service Account to use (ClusterSecretStore can reference cross-namespace)
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets-system
      
      # Optional: Specify tenant ID (if not using service account annotations)
      # tenantId: "YOUR_AZURE_TENANT_ID"

---
# Alternative: Fake/Demo SecretStore for local development
# This uses a Kubernetes secret as the backend (no cloud provider needed)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: local-secret-store
spec:
  provider:
    # Using Kubernetes secrets as the provider (for demo purposes)
    kubernetes:
      # Use the external-secrets service account
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
      server:
        # Connect to the in-cluster Kubernetes API
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets-system
      remoteNamespace: external-secrets-system
