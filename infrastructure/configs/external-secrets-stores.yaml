---
# SecretStore for cert-manager namespace
# This allows cert-manager to access secrets from Azure Key Vault
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault-cert-manager
  namespace: cert-manager
spec:
  provider:
    azurekv:
      # CONFIGURE: Replace with your Azure Key Vault URL
      # Example: https://my-keyvault.vault.azure.net
      vaultUrl: "https://YOUR_KEYVAULT_NAME.vault.azure.net"
      
      # Authentication using Azure Workload Identity
      authType: WorkloadIdentity
      
      # Service Account to use (must have Azure Workload Identity annotations)
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets-system
      
      # Optional: Specify tenant ID (if not using service account annotations)
      # tenantId: "YOUR_AZURE_TENANT_ID"

---
# Example SecretStore for default namespace
# Create similar stores in other namespaces as needed
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault-default
  namespace: default
spec:
  provider:
    azurekv:
      # CONFIGURE: Replace with your Azure Key Vault URL
      vaultUrl: "https://YOUR_KEYVAULT_NAME.vault.azure.net"
      
      authType: WorkloadIdentity
      
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets-system
