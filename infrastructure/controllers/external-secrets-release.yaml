---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: "0.9.x"  # Will use latest 0.9.x version
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 12h
  targetNamespace: external-secrets-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # ============================================================================
    # CRD Management
    # ============================================================================
    installCRDs: true
    crds:
      createClusterExternalSecret: true
      createClusterSecretStore: true
      createPushSecret: true

    # ============================================================================
    # Global Configuration
    # ============================================================================
    global:
      # Compatibility for Azure Workload Identity
      compatibility:
        openshift:
          adaptSecurityContext: disabled

    # ============================================================================
    # Controller (Main external-secrets component)
    # ============================================================================
    replicaCount: 2  # High availability

    # Azure Workload Identity configuration
    serviceAccount:
      create: true
      name: external-secrets
      annotations:
        # CONFIGURE: Set your Azure Managed Identity Client ID
        azure.workload.identity/client-id: "YOUR_AZURE_CLIENT_ID"
        # CONFIGURE: Set your Azure Tenant ID
        azure.workload.identity/tenant-id: "YOUR_AZURE_TENANT_ID"
      # Required labels for Azure Workload Identity
      labels:
        azure.workload.identity/use: "true"

    # Pod labels for Azure Workload Identity
    podLabels:
      azure.workload.identity/use: "true"

    # Resource limits/requests
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

    # Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000

    # Enable PodDisruptionBudget for HA
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    # ============================================================================
    # Webhook
    # ============================================================================
    webhook:
      replicaCount: 2  # High availability

      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000

      podDisruptionBudget:
        enabled: true
        minAvailable: 1

    # ============================================================================
    # Cert Controller (manages webhook certificates)
    # ============================================================================
    certController:
      replicaCount: 1

      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000

    # ============================================================================
    # Prometheus Monitoring
    # ============================================================================
    metrics:
      enabled: true
      service:
        enabled: true
      serviceMonitor:
        enabled: false  # Enable if using Prometheus Operator
        # interval: 30s
        # scrapeTimeout: 25s

    # ============================================================================
    # Additional Features
    # ============================================================================
    # Enable concurrent reconciliation for better performance
    concurrent: 1

    # Process ClusterStore before generic Store
    processClusterStore: true

    # Refresh interval for secrets (can be overridden per ExternalSecret)
    controllerClass: ""

    # Scope to watch for ExternalSecrets (empty = all namespaces)
    scopedNamespace: ""

    # Enable leader election for HA
    leaderElect: true
