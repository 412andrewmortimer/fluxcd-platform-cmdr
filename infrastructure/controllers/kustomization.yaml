---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Prometheus must be installed first as it provides CRDs for ServiceMonitors
  - prometheus-source.yaml
  - kube-prometheus-stack-release.yaml
  # Cert-manager depends on ServiceMonitor CRD from prometheus
  - cert-manager-source.yaml
  - cert-manager-release.yaml
  # External secrets has no dependencies
  - external-secrets-source.yaml
  - external-secrets-release.yaml
