---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "1.13.x"  # Will use latest 1.13.x version
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 12h
  targetNamespace: cert-manager
  install:
    crds: Create
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # ============================================================================
    # CRD Management
    # ============================================================================
    # Flux manages CRDs via install.crds/upgrade.crds
    crds:
      enabled: false  # Let Flux handle CRD installation
      keep: true      # Prevent CRDs from being deleted on uninstall

    # ============================================================================
    # Global Configuration
    # ============================================================================
    global:
      leaderElection:
        namespace: cert-manager  # Namespace for leader election lease
      logLevel: 2                # Verbosity: 0-6 (2 is default, good balance)
      
    # ============================================================================
    # Controller (Main cert-manager component)
    # ============================================================================
    replicaCount: 2  # High availability (uses leader election)
    
    # Resource limits/requests (adjust based on your workload)
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    
    # Security context
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    
    # Enable PodDisruptionBudget for HA
    podDisruptionBudget:
      enabled: true
      minAvailable: 1  # Keep at least 1 pod running during disruptions
    
    # ============================================================================
    # Webhook
    # ============================================================================
    webhook:
      replicaCount: 2  # High availability
      
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
      
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
    
    # ============================================================================
    # CA Injector
    # ============================================================================
    cainjector:
      enabled: true
      replicaCount: 2  # High availability
      
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
      
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
    
    # ============================================================================
    # Prometheus Monitoring
    # ============================================================================
    prometheus:
      enabled: true
      servicemonitor:
        enabled: false  # Enable if using Prometheus Operator
        # prometheusInstance: default
        # interval: 60s
        # scrapeTimeout: 30s
    
    # ============================================================================
    # Startup API Check (validates webhook endpoints)
    # ============================================================================
    startupapicheck:
      enabled: true
      timeout: 1m
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
